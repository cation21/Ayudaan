version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayudaan
      POSTGRES_PASSWORD: ayudaan
      POSTGRES_DB: ayudaan
    ports:
      - "5432:5432"
    volumes:
      - ayudaan_pg_data:/var/lib/postgresql/data

volumes:
  ayudaan_pg_data:
